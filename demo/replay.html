<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A3 · ShellOps inference replay</title>
<style>
:root{color-scheme:light;--bg:#f4f2ed;--panel:#fffefa;--line:#ddd9d0;--muted:#78766f;--text:#282923;--accent:#a7472d;--green:#526249;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 13px;cursor:pointer}
button:hover,select:hover{background:#eae6dd;border-color:#aaa397}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{height:100vh;min-height:700px;display:flex;flex-direction:column;padding:27px 36px 22px;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:2px solid var(--text)}
.brand{display:flex;align-items:center;gap:19px}.mark{font:italic 44px/1 Georgia,"Times New Roman",serif;letter-spacing:-4px;padding-right:19px;border-right:1px solid #b7b1a5}
.eyebrow{font:10px/1.5 var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
h1{font:28px/1.25 Georgia,"Times New Roman",serif;margin:3px 0 0;letter-spacing:-.6px}.meta{color:var(--muted);font:11px/1.5 var(--mono)}.head-right{text-align:right}.head-right select{font-size:12px;background:var(--panel)}.head-right .meta{margin-top:7px}
.task{display:flex;gap:26px;align-items:flex-start;padding:0 0 19px;border-bottom:1px solid var(--line)}.task-content{flex:1;min-width:0}h2{font-size:18px;font-weight:600;margin:4px 0 7px;letter-spacing:-.3px}#taskText{color:#585950;font-size:13px;max-height:150px;overflow:auto;white-space:normal;line-height:1.65}.tags{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}.tag{font:10px/1.5 var(--mono);border:1px solid var(--line);border-radius:2px;padding:3px 8px;color:var(--muted)}.tag.active{color:var(--text);border-color:#aaa397;background:#eae6dd}.tag.inactive{opacity:.5}.status{white-space:nowrap;text-align:right;padding-top:17px}.status strong{display:block;font-size:14px;font-weight:500;color:var(--green)}.status small{font:11px var(--mono);color:var(--muted)}
.workspace{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(390px,.95fr);gap:0;min-height:0;flex:1;border:1px solid var(--line);background:var(--panel)}.panel{background:var(--panel);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}.panel+.panel{border-left:1px solid var(--line)}.panel:first-child{background:#eeece5}.panel-head{height:43px;flex-shrink:0;padding:11px 15px;border-bottom:1px solid var(--line);font:10px var(--mono);text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}.panel-head span:last-child{font-size:10px;letter-spacing:0;text-transform:none}
#tree{overflow:auto;padding:12px 6px;flex:1}.file{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;text-align:left;font:11px/1.5 var(--mono);padding:9px 8px;border-radius:2px;overflow-wrap:anywhere}.file.selected{background:#dedad0;color:var(--text)}.file.changed{color:var(--accent)}.file .dot{flex:none;width:5px;height:7px;border:1px solid #959083;background:transparent}.file.changed .dot{border-color:var(--accent);background:var(--accent)}.file small{font-size:9px;margin-left:auto;color:var(--accent)}.tree-note{padding:13px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}#fileName{font:11px var(--mono);letter-spacing:0;color:var(--text);text-transform:none;overflow-wrap:anywhere}#fileState{color:var(--accent)}
.code{font:13px/1.8 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:19px 14px;overflow:auto;tab-size:4}.file-content{flex:1;overflow:auto}.line{display:flex;min-height:24px}.line-number{color:#b2ac9f;min-width:38px;text-align:right;padding-right:16px;user-select:none}.line-text{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;flex:1}.file-content.changed{box-shadow:inset 2px 0 var(--accent)}#agentContent{overflow:auto;flex:1}.section{padding:15px 18px;border-bottom:1px solid var(--line)}.section-label{font:10px var(--mono);text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:9px}.section pre{padding:0;color:var(--text);font-size:12px;line-height:1.75;overflow:visible}.section.output{background:#f7f6f1}.section.output .section-label{color:var(--green)}.section.output pre{color:#4b5544}.empty{padding:20px 18px;color:var(--muted);font-size:13px}.phase{color:var(--accent)!important}.bottom{display:flex;align-items:center;gap:20px}.controls{display:flex;gap:5px}.controls button{font-size:12px}#play{background:var(--text);color:var(--panel);border-color:var(--text);min-width:64px}.timeline{display:flex;flex:1;gap:5px;align-items:center}.tick{height:3px;flex:1;background:#dedad1}.tick.past{background:#a39e91}.tick.current{height:5px;background:var(--accent)}#position{font:11px var(--mono);color:var(--muted);min-width:145px;text-align:right}
.overview{display:none;flex:1;min-height:0}.overview-heading{padding:30px 0 33px}.overview-heading h2{font:44px/1.2 Georgia,"Times New Roman",serif;letter-spacing:-1.2px;margin:0 0 13px}.overview-heading p{color:var(--muted);margin:0;font-size:15px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--text);border-left:1px solid var(--line);counter-reset:episode}.card{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 30px;cursor:pointer;position:relative;counter-increment:episode}.card:before{content:"0" counter(episode);position:absolute;right:27px;top:22px;font:italic 36px Georgia,serif;color:#c3bbae}.card:hover{background:#ece8de}.card h3{font:26px Georgia,"Times New Roman",serif;margin:21px 0 8px}.card .sample{font:11px var(--mono);color:var(--muted)}.card-foot{margin-top:25px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font:11px var(--mono);color:var(--muted)}.verified{color:var(--green)}.overview-note{margin-top:22px;color:var(--muted);font-size:12px}.overview-mode .task,.overview-mode .workspace{display:none}.overview-mode .overview{display:block;overflow:auto}
@media(max-width:1300px){.app{padding:18px 22px;gap:14px}.workspace{grid-template-columns:180px minmax(0,1fr) minmax(330px,.95fr)}h1{font-size:24px}.code{font-size:12px;padding:13px}.section{padding:11px 13px}#taskText{max-height:80px}.card{padding:20px}.overview-heading{padding:15px 0 22px}.overview-heading h2{font-size:36px}}
</style>
</head>
<body>
<div class="app" id="app">
<header><div class="brand"><div class="mark">A3</div><div><div class="eyebrow">ShellOps · agent trajectories</div><h1>A3 / The working trace</h1></div></div><div class="head-right"><select id="episodeSelect" aria-label="Select recorded episode"></select><div class="meta">Recorded inference · A3 / Qwen3-14B · seed 42</div></div></header>
<section class="task"><div class="task-content"><div class="eyebrow" id="sample"></div><h2 id="title"></h2><div id="taskText"></div><div class="tags"><span class="tag" id="vanillaTag">Vanilla</span><span class="tag" id="sigmaTag">σ_reveal harness</span><span class="tag">Paced replay</span></div></div><div class="status"><strong id="status"></strong><small id="turn"></small></div></section>
<main class="workspace"><section class="panel"><div class="panel-head">Workspace <span id="fileCount"></span></div><div id="tree"></div><div class="tree-note">Rust marks files changed by the current action.</div></section><section class="panel"><div class="panel-head"><span id="fileName"></span><span id="fileState"></span></div><div class="file-content code" id="fileContent"></div></section><section class="panel"><div class="panel-head">Agent execution <span id="phase" class="phase"></span></div><div id="agentContent"></div></section></main>
<section class="overview" id="overview"></section>
<footer class="bottom"><div class="controls"><button id="overviewButton">Overview</button><button id="prev" aria-label="Previous state">←</button><button id="play">Play</button><button id="next" aria-label="Next state">→</button></div><div class="timeline" id="timeline"></div><div id="position"></div></footer>
</div>
<script src="replay_data.js"></script>
<script>
'use strict';
const episodes=window.A3_REPLAYS;
const $=id=>document.getElementById(id);
let episodeIndex=0,stepIndex=-1,phase='result',selectedFile='',timer=null,overview=false;
const harnessName=e=>e.harness==='vanilla'?'Vanilla':'σ_reveal harness';
function stop(){clearInterval(timer);timer=null;$('play').textContent='Play';}
function currentFiles(){const e=episodes[episodeIndex];return stepIndex<0?e.initial_files:phase==='action'?(stepIndex===0?e.initial_files:e.steps[stepIndex-1].files):e.steps[stepIndex].files;}
function renderFile(path){selectedFile=path;const files=currentFiles();const changed=stepIndex>=0&&phase==='result'&&episodes[episodeIndex].steps[stepIndex].changes.includes(path);$('fileName').textContent=path||'Workspace';$('fileState').textContent=changed?'Changed this turn':'';$('fileContent').classList.toggle('changed',changed);$('fileContent').replaceChildren();if(path){String(files[path]).split('\n').forEach((text,i)=>{const row=document.createElement('div');row.className='line';const n=document.createElement('span');n.className='line-number';n.textContent=i+1;const code=document.createElement('span');code.className='line-text';code.textContent=text;row.append(n,code);$('fileContent').append(row);});}$('fileContent').scrollTop=0;document.querySelectorAll('.file').forEach(b=>b.classList.toggle('selected',b.dataset.path===path));}
function section(label,text,output=false){const el=document.createElement('section');el.className='section'+(output?' output':'');const heading=document.createElement('div');heading.className='section-label';heading.textContent=label;const pre=document.createElement('pre');pre.className='code';pre.textContent=typeof text==='string'?text:JSON.stringify(text,null,2);el.append(heading,pre);$('agentContent').append(el);}
function timeline(){const e=episodes[episodeIndex];$('timeline').replaceChildren();for(let i=-1;i<e.steps.length;i++){const tick=document.createElement('span');tick.className='tick'+(i<stepIndex?' past':i===stepIndex?' current':'');$('timeline').append(tick);}}
window.showReplay=function(ei,si=-1,p='result'){overview=false;$('app').classList.remove('overview-mode');episodeIndex=ei;stepIndex=si;phase=p;const e=episodes[ei],s=e.steps[si];$('episodeSelect').value=ei;$('sample').textContent='Sample '+e.sample_id;$('title').textContent=e.title;$('taskText').textContent=e.task;$('vanillaTag').className='tag '+(e.harness==='vanilla'?'active':'inactive');$('sigmaTag').className='tag '+(e.harness==='sigma_reveal_rd'?'active':'inactive');$('turn').textContent='Turn '+(si+1)+' / '+e.max_turns;$('status').textContent=si<0?'Initial workspace':p==='action'?'Action preview':s.success===true?'✓ Verified success':s.done?'Episode ended':si+1>=e.max_turns?'Maximum turns reached':'Environment updated';$('phase').textContent=si<0?'Before inference':p==='action'?'Action':'Result';const files=currentFiles(),paths=Object.keys(files).sort(),changes=si>=0&&p==='result'?s.changes:[];$('fileCount').textContent=paths.length+' files';$('tree').replaceChildren();paths.forEach(path=>{const button=document.createElement('button');button.className='file'+(changes.includes(path)?' changed':'');button.dataset.path=path;const dot=document.createElement('span');dot.className='dot';const name=document.createElement('span');name.textContent=path;button.append(dot,name);button.onclick=()=>renderFile(path);$('tree').append(button);});const priorChanges=si>=0?e.steps.slice(0,p==='action'?si:si+1).flatMap(step=>step.changes).filter(path=>path in files):[];renderFile(changes.find(path=>path in files)||priorChanges[priorChanges.length-1]||paths[0]||'');$('agentContent').replaceChildren();if(si<0){section('Task',e.task);const note=document.createElement('div');note.className='empty';note.textContent='The recorded trajectory starts from the workspace shown here. Advance to inspect the first agent action.';$('agentContent').append(note);}else{if(s.plan)section('Plan',s.plan);section(s.type==='submit_answer'?'Submit answer':'Submit code',s.action);if(p==='result'){if(s.stdout)section('Standard output',s.stdout,true);if(s.stderr)section('Standard error',s.stderr,true);if(s.observation)section('Environment observation',s.observation,true);if(!s.stdout&&!s.stderr&&!s.observation)section('Execution output','No textual output.',true);}}$('agentContent').scrollTop=0;$('position').textContent=si<0?'Initial state':`Turn ${si+1} · ${p==='action'?'action':'result'}`;$('prev').disabled=si<0;$('next').disabled=si===e.steps.length-1&&p==='result';timeline();};
window.showOverview=function(){stop();overview=true;$('app').classList.add('overview-mode');$('overview').replaceChildren();const heading=document.createElement('div');heading.className='overview-heading';const title=document.createElement('h2');title.textContent='Two tasks, four recorded runs.';const p=document.createElement('p');p.textContent='Follow the commands, read the outputs, and inspect the files at every turn.';heading.append(title,p);$('overview').append(heading);const cards=document.createElement('div');cards.className='cards';episodes.forEach((e,i)=>{const last=e.steps[e.steps.length-1],card=document.createElement('div');card.className='card';const tag=document.createElement('span');tag.className='tag active';tag.textContent=harnessName(e);const title=document.createElement('h3');title.textContent=e.title;const sample=document.createElement('div');sample.className='sample';sample.textContent='Sample '+e.sample_id;const foot=document.createElement('div');foot.className='card-foot';const result=document.createElement('span');result.className=last&&last.success===true?'verified':'';result.textContent=last&&last.success===true?'✓ Verified success':'Not verified successful';const turns=document.createElement('span');turns.textContent=e.steps.length+' / '+e.max_turns+' turns';foot.append(result,turns);card.append(tag,title,sample,foot);card.onclick=()=>window.showReplay(i);cards.append(card);});$('overview').append(cards);const note=document.createElement('div');note.className='overview-note';note.textContent='Paced replay of recorded inference. Playback speed does not represent model or environment latency.';$('overview').append(note);$('timeline').replaceChildren();$('position').textContent='Recorded episodes';$('prev').disabled=true;$('next').disabled=false;};
function advance(){if(overview){window.showReplay(0);return;}const e=episodes[episodeIndex];if(stepIndex<0)window.showReplay(episodeIndex,0,'action');else if(phase==='action')window.showReplay(episodeIndex,stepIndex,'result');else if(stepIndex+1<e.steps.length)window.showReplay(episodeIndex,stepIndex+1,'action');else stop();}
episodes.forEach((e,i)=>{const option=document.createElement('option');option.value=i;option.textContent=harnessName(e)+' · '+e.sample_id;$('episodeSelect').append(option);});$('episodeSelect').onchange=()=>{stop();window.showReplay(Number($('episodeSelect').value));};$('next').onclick=()=>{stop();advance();};$('prev').onclick=()=>{stop();if(phase==='result'&&stepIndex>=0)window.showReplay(episodeIndex,stepIndex,'action');else window.showReplay(episodeIndex,stepIndex-1,'result');};$('overviewButton').onclick=window.showOverview;$('play').onclick=()=>{if(timer){stop();return;}if(!overview&&stepIndex===episodes[episodeIndex].steps.length-1&&phase==='result')window.showReplay(episodeIndex);advance();timer=setInterval(advance,3500);$('play').textContent='Pause';};window.showOverview();
</script>
</body>
</html>
